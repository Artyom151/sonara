[package]
name = "sonara"
version = "1.0.0"
description = "Sonara music player"
authors = ["Sonara"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "sonara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
# Native, CORS-free fetch for the in-app backend. `unsafe-headers` lets youtubei.js
# set User-Agent / Origin like the official clients do.
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-opener = "2"
discord-rich-presence = "1.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Windows: WebView2 memory target level (trim while minimised). Same versions Tauri/wry use.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
