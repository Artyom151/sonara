[package]
name = "sonara"
version = "1.1.23"
description = "Sonara music player"
authors = ["Sonara"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "sonara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-log = "2"
# Native, CORS-free fetch for the in-app backend. `unsafe-headers` lets youtubei.js
# set User-Agent / Origin like the official clients do.
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-opener = "2"
discord-rich-presence = "1.1.0"
# Local media proxy for YouTube audio (src/media_proxy.rs).
tiny_http = "0.12"
ureq = { version = "2", features = ["socks-proxy", "json"] }
# Urgent (OOB) bytes for the DPI bypass (src/dpi.rs).
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Windows: WebView2 memory target level (trim while minimised). Same versions Tauri/wry use.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Foundation", "Media_Devices", "Devices_Enumeration"] }

# Island player: headphones connecting (src/audio_devices.rs, BlueZ over D-Bus).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
