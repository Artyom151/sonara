<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Sonara promo</title>
<style>
  @font-face { font-family: 'Inter'; src: url('fonts/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: 'Inter'; src: url('fonts/inter-cyrillic-wght-normal.woff2') format('woff2'); font-weight: 100 900; unicode-range: U+0400-04FF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #050507; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #050507; }
  .abs { position: absolute; will-change: transform, opacity; }

  /* Aurora background: soft radial gradients only (no CSS blur needed) */
  .aurora { width: 1500px; height: 1500px; border-radius: 50%; left: -210px; top: 210px; opacity: 0.55; }

  /* Window card with a screenshot */
  .persp { position: absolute; left: 0; right: 0; top: 0; bottom: 0; perspective: 1800px; }
  .card { position: absolute; left: 50px; width: 980px; height: 628px; border-radius: 34px; overflow: hidden;
          box-shadow: 0 60px 120px -30px rgb(0 0 0 / .85), 0 0 0 1.5px rgb(255 255 255 / .14); background: #000; transform-style: preserve-3d; }
  .card .shotwrap { position: absolute; left: 0; top: 0; width: 980px; height: 628px; transform-origin: 0 0; }
  .card .shot { position: absolute; left: 0; top: 0; width: 980px; height: 628px; }
  .cmt { position: absolute; left: 458px; width: 470px; display: flex; gap: 12px; padding: 12px 14px; border-radius: 16px;
         background: rgb(52 36 92 / .92); box-shadow: inset 0 1px 0 rgb(255 255 255 / .18), 0 10px 26px -10px rgb(0 0 0 / .6); font-size: 13px; }
  .cmt .av { width: 30px; height: 30px; border-radius: 50%; flex: none; }
  .cmt b { font-size: 12.5px; } .cmt small { color: rgb(255 255 255 / .5); font-size: 11px; margin-left: 6px; }
  .cmt p { margin-top: 3px; line-height: 1.3; }
  .cmt i { display: inline-block; margin-top: 6px; padding: 1px 7px; border-radius: 6px; font-style: normal; font-size: 10.5px; font-weight: 700; color: #d8c8ff; background: rgb(255 255 255 / .1); }
  .card::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
          background: linear-gradient(125deg, rgb(255 255 255 / .16), transparent 32%, transparent 70%, rgb(255 255 255 / .06)); }

  .headline { left: 60px; right: 60px; top: 230px; text-align: center; font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -0.045em; }
  .sub { left: 80px; right: 80px; top: 470px; text-align: center; font-weight: 600; font-size: 44px; line-height: 1.2; color: rgb(255 255 255 / .72); letter-spacing: -0.01em; }
  .accent { background: linear-gradient(100deg, var(--a1), var(--a2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .word { display: inline-block; will-change: transform, opacity; }

  .chip { display: inline-flex; align-items: center; gap: 14px; height: 92px; padding: 0 38px; border-radius: 46px; font-size: 42px; font-weight: 700;
          background: linear-gradient(180deg, rgb(255 255 255 / .16), rgb(255 255 255 / .05)); box-shadow: inset 0 1.5px 0 rgb(255 255 255 / .45), inset 0 -1px 0 rgb(255 255 255 / .1), 0 20px 50px -14px rgb(0 0 0 / .6);
          border: 1px solid rgb(255 255 255 / .16); backdrop-filter: blur(18px) saturate(170%); -webkit-backdrop-filter: blur(18px) saturate(170%); }
  .dot { width: 18px; height: 18px; border-radius: 50%; }

  /* Captions (TikTok-style), synced with the voiceover */
  .caption { left: 70px; right: 70px; top: 1480px; text-align: center; font-weight: 800; font-size: 54px; line-height: 1.22; letter-spacing: -0.02em; }
  .caption .w { display: inline-block; margin: 0 7px; transition: none; }
  .caption .w.on { color: #fff; }
  .caption .w.off { color: rgb(255 255 255 / .38); }
  .caption-bg { left: 50px; right: 50px; top: 1440px; height: 230px; border-radius: 48px;
          background: linear-gradient(180deg, rgb(0 0 0 / .0), rgb(0 0 0 / .35)); }

  .flash { inset: 0; background: #fff; opacity: 0; }
  .grain { inset: 0; opacity: .06; mix-blend-mode: overlay; pointer-events: none; }
  .vignette { inset: 0; background: radial-gradient(120% 80% at 50% 45%, transparent 55%, rgb(0 0 0 / .65)); pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="aurora1" class="abs aurora"></div>
  <div id="aurora2" class="abs aurora"></div>
  <div id="aurora3" class="abs aurora"></div>

  <!-- S1: handwritten logotype + hook -->
  <svg id="script" class="abs" width="900" height="346" viewBox="0 0 520 200" style="left:90px; top:640px; overflow:visible">
    <defs>
      <linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
    </defs>
    <path id="scriptPath" fill="none" stroke="url(#sg)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"
      d="M 22 146 C 40 138, 58 110, 70 82 C 78 98, 94 108, 92 124 C 90 142, 72 146, 62 138 C 76 146, 94 144, 108 126 C 116 106, 124 84, 140 84 C 120 84, 106 104, 110 124 C 114 144, 142 144, 152 122 C 158 104, 152 86, 140 84 C 152 92, 162 92, 174 86 C 174 104, 172 124, 170 140 C 176 112, 190 82, 206 84 C 222 86, 216 120, 218 132 C 220 144, 234 144, 248 128 C 256 112, 268 90, 288 86 C 266 80, 248 98, 250 118 C 252 142, 280 142, 286 116 L 290 86 C 288 104, 286 124, 290 134 C 294 146, 308 142, 318 126 C 324 110, 330 94, 334 84 C 340 94, 350 96, 358 86 C 354 104, 356 124, 362 134 C 368 144, 382 142, 394 126 C 402 112, 414 90, 434 86 C 412 80, 394 98, 396 118 C 398 142, 426 142, 432 116 L 436 86 C 434 104, 432 124, 436 134 C 440 146, 458 144, 474 124"/>
  </svg>
  <div id="hook" class="abs headline" style="top:1080px; font-size:88px"></div>

  <!-- Headlines for app scenes -->
  <div id="h2" class="abs headline"></div>
  <div id="s2" class="abs sub"></div>

  <!-- Cards -->
  <div class="persp" id="perspA"><div id="cardA" class="card"><div class="shotwrap" id="wrapA"><img class="shot" id="shotA" />
    <!-- Demo comments over the (empty) comments panel of track-comment.png -->
    <div id="cmts">
      <div class="cmt" id="cmt1"><span class="av" style="background:linear-gradient(140deg,#f59e0b,#f43f5e)"></span><div><b>nika</b><small>@nika.wav · сейчас</small><p>Вот этот момент — лучший в треке</p><i>0:40</i></div></div>
      <div class="cmt" id="cmt2"><span class="av" style="background:linear-gradient(140deg,#0ea5e9,#6366f1)"></span><div><b>max</b><small>@maxbeats · 1 мин</small><p>Поставил на повтор</p><i>1:12</i></div></div>
    </div>
  </div></div></div>
  <div class="persp" id="perspB"><div id="cardB" class="card"><div class="shotwrap" id="wrapB"><img class="shot" id="shotB" /></div></div></div>

  <!-- Feature chips -->
  <div id="chips" class="abs" style="left:0; right:0; top:1250px; display:flex; justify-content:center; gap:22px"></div>
  <svg id="heart" class="abs" width="240" height="240" viewBox="-60 -60 120 120" style="left:420px; top:1180px; overflow:visible"></svg>

  <!-- End card -->
  <svg id="mark" class="abs" width="360" height="360" viewBox="0 0 108 108" style="left:360px; top:560px">
    <path d="M 74.67 46.48 A 22 22 0 1 1 61.52 33.33" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="69.56" cy="38.44" r="4.5" fill="#fff"/>
  </svg>
  <div id="glow" class="abs" style="left:190px; top:390px; width:700px; height:700px; border-radius:50%"></div>
  <div id="endTitle" class="abs headline" style="top:980px; font-size:150px">Sonara</div>
  <div id="endSub" class="abs sub" style="top:1170px; font-size:52px">Слушай по‑своему</div>

  <div class="abs caption-bg" id="capbg"></div>
  <div id="caption" class="abs caption"></div>

  <svg class="abs grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="abs vignette"></div>
  <div id="flash" class="abs flash"></div>
</div>

<script>
/* ───────────── timing ───────────── */
const DURATION = 30.5;
// Voiceover windows (start, duration) — must match render.mjs
const VO = [
  [0.30, 2.00, 'Устал листать одно и то же?'],
  [3.50, 4.30, 'Знакомься — Sonara. SoundCloud и YouTube в одном приложении.'],
  [8.10, 3.48, 'Волна подбирает треки под твой вкус. Бесконечно.'],
  [12.70, 3.87, 'Комментируй прямо в треке и смотри, кому он тоже понравился.'],
  [17.50, 2.93, 'Ищи что угодно и собирай свои плейлисты.'],
  [21.50, 3.38, 'Жидкое стекло. Android, Windows и Linux.'],
  [26.25, 1.95, 'Sonara. Слушай по‑своему.'],
];
const SCENES = [0, 3.4, 8.0, 12.6, 17.4, 21.4, 26.0, DURATION];
const PALETTE = [
  ['#7c3aed', '#db2777', '#1e1b4b'], // hook
  ['#8b5cf6', '#ec4899', '#312e81'], // app
  ['#a855f7', '#f59e0b', '#3b0764'], // wave
  ['#ef4444', '#f97316', '#450a0a'], // comments
  ['#0ea5e9', '#8b5cf6', '#082f49'], // search
  ['#14b8a6', '#6366f1', '#042f2e'], // glass
  ['#8b5cf6', '#f0abfc', '#1e1b4b'], // end
];

/* ───────────── helpers ───────────── */
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOutExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const easeOutBack = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hexMix = (a, b, x) => {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], x))).join(' ')})`;
};
const sceneIndex = (t) => Math.max(0, SCENES.findIndex((s, i) => t >= s && t < SCENES[i + 1]));
const show = (el, o) => { el.style.opacity = o; el.style.visibility = o <= 0.001 ? 'hidden' : 'visible'; };

/* words with per-word reveal */
function setWords(el, html) {
  if (el.dataset.src === html) return;
  el.dataset.src = html;
  // Words inside <span class="accent"> get the gradient themselves: background-clip:text
  // does not reach transformed (animated) children.
  let accent = false;
  el.innerHTML = html.replace(/(<[^>]+>)|([^\s<]+)/g, (m, tag, w) => {
    if (tag) {
      if (/class="accent"/.test(tag)) { accent = true; return ''; }
      if (tag === '</span>' && accent) { accent = false; return ''; }
      return tag;
    }
    return `<span class="word${accent ? ' accent' : ''}">${w}</span>`;
  });
}
function revealWords(el, p, stagger = 0.12) {
  const words = [...el.querySelectorAll('.word')];
  words.forEach((w, i) => {
    const x = easeOutBack(clamp(p * (1 + stagger * words.length) - i * stagger));
    w.style.opacity = clamp(x * 1.4);
    w.style.transform = `translateY(${(1 - x) * 60}px)`;
  });
}

/* camera on a screenshot inside a card: focus point (0..1) and zoom */
function camera(img, fx, fy, zoom) {
  const W = 980, H = 628;
  const tx = clamp(W / 2 - fx * W * zoom, W - W * zoom, 0);
  const ty = clamp(H / 2 - fy * H * zoom, H - H * zoom, 0);
  img.style.transform = `translate(${tx}px, ${ty}px) scale(${zoom})`;
}

function setShot(img, src) { if (!img.src.endsWith(src)) img.src = src; }

/* chips */
function setChips(list) {
  const el = $('chips');
  const key = list.join('|');
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  el.innerHTML = list.map((c) => { const [label, color] = c.split(':'); return `<div class="chip"><span class="dot" style="background:${color}"></span>${label}</div>`; }).join('');
}

/* heart burst (like) */
function heart(p) {
  const svg = $('heart');
  if (p <= 0 || p >= 1) { svg.style.visibility = 'hidden'; return; }
  svg.style.visibility = 'visible';
  const s = easeOutBack(clamp(p * 3)) * (1 - 0.15 * easeInOut(seg(p, 0.5, 1)));
  const rays = Array.from({ length: 12 }, (_, i) => {
    const a = (i / 12) * Math.PI * 2;
    const r0 = 26 + 40 * easeOut(p), r1 = r0 + 18 * (1 - p);
    return `<line x1="${Math.cos(a) * r0}" y1="${Math.sin(a) * r0}" x2="${Math.cos(a) * r1}" y2="${Math.sin(a) * r1}" stroke="#ff8fb3" stroke-width="4" stroke-linecap="round" opacity="${1 - p}"/>`;
  }).join('');
  svg.innerHTML = `${rays}<g transform="scale(${s})"><path d="M0 18 C-30 -2,-26 -26,-10 -26 C-3 -26,0 -20,0 -16 C0 -20,3 -26,10 -26 C26 -26,30 -2,0 18Z" fill="#ff4d7d"/></g>`;
  svg.style.opacity = 1 - seg(p, 0.75, 1);
}

/* captions synced to VO words */
function caption(t) {
  const el = $('caption');
  const line = VO.find(([s, d]) => t >= s - 0.15 && t < s + d + 0.35);
  if (!line) { show(el, 0); show($('capbg'), 0); return; }
  const [s, d, text] = line;
  if (el.dataset.src !== text) {
    el.dataset.src = text;
    el.innerHTML = text.split(' ').map((w) => `<span class="w">${w}</span>`).join(' ');
  }
  const words = [...el.querySelectorAll('.w')];
  const k = clamp((t - s) / d) * words.length;
  words.forEach((w, i) => (w.className = `w ${i < k + 0.15 ? 'on' : 'off'}`));
  const o = seg(t, s - 0.15, s + 0.05) * (1 - seg(t, s + d + 0.15, s + d + 0.35));
  show(el, o);
  show($('capbg'), o);
  el.style.transform = `translateY(${(1 - o) * 20}px)`;
}

/* ───────────── frame ───────────── */
window.renderFrame = (t) => {
  const si = sceneIndex(t);
  const ls = t - SCENES[si];

  // Aurora colours cross-fade between scenes
  const [a1, a2, a3] = PALETTE[si];
  const nxt = PALETTE[Math.min(si + 1, PALETTE.length - 1)];
  const blend = seg(t, SCENES[si + 1] - 0.5, SCENES[si + 1]);
  const c1 = hexMix(a1, nxt[0], blend), c2 = hexMix(a2, nxt[1], blend), c3 = hexMix(a3, nxt[2], blend);
  document.documentElement.style.setProperty('--a1', c1);
  document.documentElement.style.setProperty('--a2', c2);
  const au = [$('aurora1'), $('aurora2'), $('aurora3')];
  au[0].style.background = `radial-gradient(closest-side, ${c1}, transparent)`;
  au[1].style.background = `radial-gradient(closest-side, ${c2}, transparent)`;
  au[2].style.background = `radial-gradient(closest-side, ${c3}, transparent)`;
  au[0].style.transform = `translate(${Math.sin(t * 0.5) * 260 - 120}px, ${Math.cos(t * 0.4) * 200 - 260}px) scale(${1 + 0.1 * Math.sin(t)})`;
  au[1].style.transform = `translate(${Math.cos(t * 0.45) * 280 + 220}px, ${Math.sin(t * 0.35) * 240 + 480}px) scale(${1.1 + 0.1 * Math.cos(t * 0.8)})`;
  au[2].style.transform = `translate(${Math.sin(t * 0.3) * 200}px, ${Math.cos(t * 0.5) * 180 + 900}px) scale(1.3)`;

  // ── S1: script + hook ──
  {
    const on = t < 3.6;
    const path = $('scriptPath');
    const len = path.getTotalLength();
    const draw = easeInOut(seg(t, 0.15, 2.35));
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len * (1 - draw);
    const out = easeOut(seg(t, 2.95, 3.4));
    $('script').style.transform = `scale(${1 + out * 0.5}) translateY(${-out * 80}px)`;
    show($('script'), on ? 1 - out : 0);
    setWords($('hook'), 'Устал листать<br><span class="accent">одно и то же?</span>');
    revealWords($('hook'), seg(t, 0.35, 1.6), 0.18);
    $('hook').style.transform = `scale(${1 + out * 0.3})`;
    show($('hook'), on ? 1 - out : 0);
    $('flash').style.opacity = 0.85 * (1 - seg(t, 3.4, 3.62)) * (t >= 3.38 ? 1 : 0);
  }

  // ── headline per app scene ──
  const heads = {
    1: ['<span class="accent">Sonara</span>', 'SoundCloud + YouTube<br>в одном приложении'],
    2: ['<span class="accent">Волна</span>', 'подбирает треки под твой вкус<br>бесконечно'],
    3: ['Комментарии<br><span class="accent">в треке</span>', 'и лайки других слушателей'],
    4: ['Поиск<br>и <span class="accent">плейлисты</span>', 'всё, что ты любишь, рядом'],
    5: ['<span class="accent">Liquid Glass</span>', 'на всех твоих устройствах'],
  };
  if (heads[si]) {
    const [h, s] = heads[si];
    setWords($('h2'), h);
    setWords($('s2'), s);
    const p = seg(ls, 0.05, 0.9);
    revealWords($('h2'), p, 0.2);
    revealWords($('s2'), seg(ls, 0.35, 1.3), 0.06);
    const out = seg(t, SCENES[si + 1] - 0.3, SCENES[si + 1]);
    show($('h2'), 1 - out);
    show($('s2'), 1 - out);
    $('h2').style.top = si === 3 || si === 4 ? '190px' : '230px';
    $('s2').style.top = si === 3 || si === 4 ? '430px' : '380px';
  } else {
    show($('h2'), 0);
    show($('s2'), 0);
  }

  // ── cards ──
  const A = $('cardA'), B = $('cardB'), shotA = $('shotA'), shotB = $('shotB'), wrapA = $('wrapA'), wrapB = $('wrapB');
  show($('cmts'), si === 3 ? 1 : 0);
  $('perspA').style.zIndex = si === 5 ? 2 : 1;
  $('perspB').style.zIndex = si === 5 ? 1 : 2;
  show(A, 0);
  show(B, 0);
  const cardTop = 700;
  if (si >= 1 && si <= 5) {
    const enter = easeOutBack(seg(ls, 0, 0.9));
    const exit = easeInOut(seg(t, SCENES[si + 1] - 0.35, SCENES[si + 1]));
    const base = (rx, ry, extra = '') =>
      `translateY(${(1 - enter) * 700 - exit * 240}px) rotateX(${lerp(26, 7, enter) + exit * 10}deg) rotateY(${ry}deg) scale(${lerp(0.78, 1, enter) * (1 - exit * 0.12)}) ${extra}`;
    A.style.top = `${cardTop}px`;
    show(A, clamp(enter * 1.3) * (1 - exit));

    if (si === 1) {
      setShot(shotA, '../photos/main-menu.png');
      A.style.transform = base(7, Math.sin(t * 0.6) * 3);
      camera(wrapA, 0.53, 0.35, lerp(1, 1.18, easeInOut(seg(ls, 0.4, 4.4))));
    } else if (si === 2) {
      setShot(shotA, '../photos/wave-settings.png');
      A.style.transform = base(7, -3);
      const z1 = easeInOut(seg(ls, 0.5, 1.6)), z2 = easeInOut(seg(ls, 2.0, 3.6));
      camera(wrapA, lerp(lerp(0.5, 0.2, z1), 0.55, z2), lerp(lerp(0.5, 0.33, z1), 0.73, z2), lerp(lerp(1, 1.9, z1), 1.55, z2));
    } else if (si === 3) {
      setShot(shotA, '../photos/track-comment.png');
      A.style.transform = base(7, 3);
      const z = easeInOut(seg(ls, 0.7, 2.0));
      camera(wrapA, lerp(0.5, 0.7, z), lerp(0.5, 0.28, z), lerp(1, 1.6, z));
      [['cmt1', 1.3, 98], ['cmt2', 2.0, 186]].forEach(([id, at, y]) => {
        const x = easeOutBack(seg(ls, at, at + 0.55));
        const c = $(id);
        c.style.top = `${y}px`;
        c.style.opacity = clamp(x * 1.5);
        c.style.transform = `translateY(${(1 - x) * 30}px) scale(${lerp(0.9, 1, x)})`;
      });
      heart(seg(ls, 2.9, 4.4));
    } else if (si === 4) {
      setShot(shotA, '../photos/search-page.png');
      setShot(shotB, '../photos/favourite-page.png');
      const sw = easeInOut(seg(ls, 1.9, 2.5));
      A.style.transform = `${base(7, 0)} translateX(${-sw * 1100}px) rotateY(${sw * -25}deg)`;
      camera(wrapA, 0.45, 0.3, lerp(1, 1.25, easeInOut(seg(ls, 0.3, 1.9))));
      B.style.top = `${cardTop}px`;
      show(B, clamp(sw * 1.5) * (1 - exit));
      B.style.transform = `translateX(${(1 - sw) * 1100}px) rotateX(7deg) rotateY(${(1 - sw) * 25}deg) scale(${1 - exit * 0.12}) translateY(${-exit * 240}px)`;
      camera(wrapB, 0.4, 0.3, lerp(1.25, 1.05, easeInOut(seg(ls, 2.2, 4))));
    } else if (si === 5) {
      setShot(shotA, '../photos/track-without-lyrics.png');
      setShot(shotB, '../photos/profile-page.png');
      B.style.top = `${cardTop - 60}px`;
      show(B, clamp(enter * 1.3) * (1 - exit) * 0.9);
      B.style.transform = `translateY(${(1 - enter) * 800 - exit * 240}px) translateX(70px) rotateX(10deg) rotateY(-14deg) scale(${lerp(0.7, 0.86, enter)})`;
      camera(wrapB, 0.5, 0.4, 1.05);
      A.style.top = `${cardTop + 130}px`;
      A.style.transform = `${base(7, 10 + Math.sin(t) * 2)} translateX(-40px)`;
      camera(wrapA, 0.4, 0.55, lerp(1.05, 1.3, easeInOut(seg(ls, 0.6, 4.2))));
    }
  }
  if (si !== 3) heart(0);

  // ── chips (platforms) ──
  if (si === 5) {
    setChips(['Android:#30d158', 'Windows:#0a84ff', 'Linux:#ffd60a']);
    const out = seg(t, SCENES[6] - 0.3, SCENES[6]);
    [...$('chips').children].forEach((c, i) => {
      const x = easeOutBack(seg(ls, 1.2 + i * 0.45, 1.75 + i * 0.45));
      c.style.opacity = clamp(x) * (1 - out);
      c.style.transform = `translateY(${(1 - x) * 120}px) scale(${lerp(0.6, 1, x)})`;
    });
    $('chips').style.top = '470px';
    show($('chips'), 1);
  } else show($('chips'), 0);

  // ── S7: end card ──
  {
    const on = si === 6;
    const p = seg(t, 26.0, 26.9);
    const fade = 1 - seg(t, DURATION - 0.7, DURATION);
    const mark = $('mark');
    mark.style.transform = `scale(${lerp(0.4, 1, easeOutBack(p))}) rotate(${lerp(-120, 0, easeOutExpo(p))}deg)`;
    show(mark, on ? clamp(p * 2) * fade : 0);
    const glow = $('glow');
    glow.style.background = `radial-gradient(closest-side, ${hexMix('#8b5cf6', '#f0abfc', 0.5 + 0.5 * Math.sin(t * 2))}88, transparent)`;
    glow.style.transform = `scale(${0.9 + 0.08 * Math.sin(t * 3)})`;
    show(glow, on ? clamp(p * 1.5) * fade : 0);
    const tp = easeOutExpo(seg(t, 26.4, 27.3));
    $('endTitle').style.transform = `translateY(${(1 - tp) * 80}px)`;
    $('endTitle').style.letterSpacing = `${lerp(0.2, -0.045, tp)}em`;
    show($('endTitle'), on ? tp * fade : 0);
    const sp = easeOut(seg(t, 27.0, 27.8));
    $('endSub').style.transform = `translateY(${(1 - sp) * 40}px)`;
    show($('endSub'), on ? sp * fade : 0);
    $('stage').style.filter = t > DURATION - 0.7 ? `brightness(${fade})` : '';
  }

  caption(t);
};

window.assetsReady = async () => {
  await document.fonts.ready;
  const srcs = ['main-menu', 'wave-settings', 'track-comment', 'search-page', 'favourite-page', 'track-without-lyrics', 'profile-page'];
  await Promise.all(srcs.map((s) => { const i = new Image(); i.src = `../photos/${s}.png`; return i.decode(); }));
  return true;
};

// Live preview when opened directly: ?t=12.3 shows a still, otherwise plays in real time.
const q = new URLSearchParams(location.search);
if (q.has('t')) window.renderFrame(Number(q.get('t')));
else if (!q.has('render')) { const t0 = performance.now(); const loop = () => { window.renderFrame(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
else window.renderFrame(0);
</script>
