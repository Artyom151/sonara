apply plugin: 'com.android.application'

// Release signing: android/keystore.properties (created by `pnpm android:keystore`, never committed).
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    testOptions { unitTests.returnDefaultValues = true }
    namespace = "app.sonara.music"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.sonara.music"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1020499
        versionName "1.2.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Signed with the Sonara key when present, otherwise with the debug key so the APK still installs.
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.media:media:1.7.1"
    // Material 3 shapes (MaterialShapes) for the home screen widget. Only the shape presets are used:
    // their Compose geometry types are pulled in without their transitive dependencies, which are not cached.
    implementation("androidx.compose.material3:material3:1.5.0-alpha29") { transitive = false }
    implementation("androidx.compose.ui:ui-graphics-android:1.13.0-alpha01") { transitive = false }
    implementation("androidx.compose.ui:ui-geometry-android:1.13.0-alpha01") { transitive = false }
    implementation("androidx.compose.ui:ui-unit-android:1.13.0-alpha01") { transitive = false }
    implementation("androidx.compose.ui:ui-util-android:1.13.0-alpha01") { transitive = false }
    implementation "androidx.graphics:graphics-shapes-android:1.0.1"
    implementation "androidx.graphics:graphics-path:1.0.1"
    // Chromecast sender (CastPlugin): the device picker and the remote media client.
    implementation "com.google.android.gms:play-services-cast-framework:22.0.0"
    implementation "androidx.mediarouter:mediarouter:1.7.0"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Material 3 alpha29 asks for AGP 9.1 and compileSdk 37 (this project uses 8.13). Only its shape
// presets are used, plain Java, so the AAR metadata check is skipped instead of upgrading the build.
tasks.matching { it.name == 'checkReleaseAarMetadata' || it.name == 'checkDebugAarMetadata' }.configureEach { enabled = false }
